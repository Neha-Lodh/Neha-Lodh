<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="NEHA LODH — Computer Science | Aspiring Data Analyst. Turning data into insights and ideas into reality." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="82%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#0E4429" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0E4429" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0E4429" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353"/>
      <stop offset="45%" stop-color="#0E4429"/>
      <stop offset="100%" stop-color="#0E4429" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26A641" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0E4429" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6EDF3" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1280" height="340" fill="#0D1117"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <!-- data line (right) -->
  <line x1="780" y1="300" x2="1230" y2="300" stroke="#E6EDF3" stroke-opacity="0.18" stroke-dasharray="3 6"/>
  <polygon points="780,290 840,262 900,274 960,222 1020,236 1080,168 1140,184 1200,102 1230,80 1230,300 780,300" fill="url(#area)"/>
  <polyline points="780,290 840,262 900,274 960,222 1020,236 1080,168 1140,184 1200,102 1230,80" fill="none" stroke="#39D353" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#0D1117" stroke="#39D353" stroke-width="1.6">
    <circle cx="840" cy="262" r="4"/>
    <circle cx="900" cy="274" r="4"/>
    <circle cx="960" cy="222" r="4"/>
    <circle cx="1020" cy="236" r="4"/>
    <circle cx="1080" cy="168" r="4"/>
    <circle cx="1140" cy="184" r="4"/>
    <circle cx="1200" cy="102" r="4"/>
  </g>
  <circle cx="1230" cy="80" r="5" fill="#39D353"/>
  <circle cx="1230" cy="80" r="5" fill="none" stroke="#39D353" stroke-width="1.5">
    <animate attributeName="r" values="5;18" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- corner brackets -->
  <g fill="none" stroke="#39D353" stroke-width="1.5" stroke-opacity="0.85">
    <path d="M36 70V36H70"/>
    <path d="M1244 270V304H1210"/>
  </g>

  <!-- terminal line -->
  <text x="80" y="92" font-family="'SFMono-Regular','Consolas','Liberation Mono',Menlo,monospace" font-size="14" fill="#39D353" fill-opacity="0.85" letter-spacing="1.5">&gt; init portfolio --role=analyst</text>

  <!-- name -->
  <text x="78" y="176" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="72" fill="#E6EDF3" letter-spacing="12">NEHA LODH</text>
  <rect x="80" y="196" width="520" height="2" fill="url(#rule)"/>

  <!-- title -->
  <text x="80" y="238" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#E6EDF3" letter-spacing="2.5">Computer Science <tspan fill="#39D353">|</tspan> Aspiring Data Analyst</text>

  <!-- tagline -->
  <text x="80" y="282" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-style="italic" font-size="20" fill="#8B949E">Turning data into insights and ideas into reality.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
